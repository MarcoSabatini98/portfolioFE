<header class="nav">
  <a routerLink="/" class="brand">M</a>

  <!-- Desktop nav -->
  <nav class="nav-desktop" aria-label="Main navigation">
    <a
      routerLink="/progetti"
      routerLinkActive="active"
      #rlaProgetti="routerLinkActive"
      [attr.aria-current]="rlaProgetti.isActive ? 'page' : null"
      >{{ 'nav.projects' | translate }}</a
    >
    <a
      routerLink="/chi-sono"
      routerLinkActive="active"
      #rlaChi="routerLinkActive"
      [attr.aria-current]="rlaChi.isActive ? 'page' : null"
      >{{ 'nav.about' | translate }}</a
    >
    <a
      routerLink="/contatti"
      routerLinkActive="active"
      #rlaContatti="routerLinkActive"
      [attr.aria-current]="rlaContatti.isActive ? 'page' : null"
      >{{ 'nav.contact' | translate }}</a
    >
  </nav>

  <div class="controls">
    <button
      type="button"
      (click)="lang.toggle()"
      [attr.aria-label]="lang.lang() === 'it' ? 'Switch to English' : 'Passa all\'italiano'"
    >
      {{ lang.lang() === 'it' ? 'EN' : 'IT' }}
    </button>
    <button
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? 'light mode' : 'dark mode'"
    >
      {{ theme.theme() === 'dark' ? '☀' : '☾' }}
    </button>

    <!-- Hamburger (mobile only) -->
    <button
      type="button"
      class="hamburger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      [attr.aria-label]="menuOpen() ? 'Chiudi menu' : 'Apri menu'"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</header>

<!-- Mobile nav dropdown -->
<nav
  id="mobile-nav"
  class="nav-mobile"
  [class.open]="menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
  aria-label="Mobile navigation"
>
  <a
    routerLink="/progetti"
    routerLinkActive="active"
    #rlaMP="routerLinkActive"
    [attr.aria-current]="rlaMP.isActive ? 'page' : null"
    >{{ 'nav.projects' | translate }}</a
  >
  <a
    routerLink="/chi-sono"
    routerLinkActive="active"
    #rlaMA="routerLinkActive"
    [attr.aria-current]="rlaMA.isActive ? 'page' : null"
    >{{ 'nav.about' | translate }}</a
  >
  <a
    routerLink="/contatti"
    routerLinkActive="active"
    #rlaMMC="routerLinkActive"
    [attr.aria-current]="rlaMMC.isActive ? 'page' : null"
    >{{ 'nav.contact' | translate }}</a
  >
</nav>

<main>
  <router-outlet />
</main>

<app-footer />
