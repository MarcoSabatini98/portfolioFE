<header class="nav">
  <a href="#hero" class="brand">MS</a>
  <nav>
    <a href="#projects">{{ 'nav.projects' | translate }}</a>
    <a href="#about">{{ 'nav.about' | translate }}</a>
    <a href="#contact">{{ 'nav.contact' | translate }}</a>
  </nav>
  <div class="controls">
    <button
      type="button"
      (click)="lang.toggle()"
      [attr.aria-label]="lang.lang() === 'it' ? 'Switch to English' : 'Passa all\'italiano'"
    >
      {{ lang.lang() === 'it' ? 'EN' : 'IT' }}
    </button>
    <button
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? 'light mode' : 'dark mode'"
    >
      {{ theme.theme() === 'dark' ? '☀' : '☾' }}
    </button>
  </div>
</header>

<main>
  <app-hero />
  <app-projects />
  <app-about />
  <app-skills />
  <app-contact />
</main>

<footer class="foot">© {{ year }} Marco Sabatini</footer>
