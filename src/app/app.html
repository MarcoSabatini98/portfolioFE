<header class="nav">
  <a routerLink="/" class="brand">
    <span class="brand-tile" aria-hidden="true">MS</span>
    <span class="brand-name">Marco Sabatini</span>
  </a>

  <div class="nav-right">
    <div class="controls">
      <button
        type="button"
        class="has-tip"
        (click)="lang.toggle()"
        [attr.aria-label]="'a11y.switchLang' | translate"
        [attr.data-tip]="'a11y.switchLang' | translate"
      >
        {{ lang.lang() === 'it' ? 'EN' : 'IT' }}
      </button>
      <button
        type="button"
        class="has-tip"
        (click)="theme.toggle()"
        [attr.aria-label]="
          (theme.theme() === 'dark' ? 'a11y.lightMode' : 'a11y.darkMode') | translate
        "
        [attr.data-tip]="
          (theme.theme() === 'dark' ? 'a11y.lightMode' : 'a11y.darkMode') | translate
        "
      >
        <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>
    </div>

    <!-- Desktop nav -->
    <nav class="nav-desktop" [attr.aria-label]="'a11y.mainNav' | translate">
      <a
        routerLink="/progetti"
        routerLinkActive="active"
        #rlaProgetti="routerLinkActive"
        [attr.aria-current]="rlaProgetti.isActive ? 'page' : null"
        >{{ 'nav.projects' | translate }}</a
      >
      <a
        routerLink="/chi-sono"
        routerLinkActive="active"
        #rlaChi="routerLinkActive"
        [attr.aria-current]="rlaChi.isActive ? 'page' : null"
        >{{ 'nav.about' | translate }}</a
      >
      <a
        routerLink="/contatti"
        routerLinkActive="active"
        class="nav-cta"
        #rlaContatti="routerLinkActive"
        [attr.aria-current]="rlaContatti.isActive ? 'page' : null"
        >{{ 'nav.contact' | translate }}</a
      >
    </nav>

    <!-- Hamburger (phone + tablet only) -->
    <button
      type="button"
      class="hamburger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      [attr.aria-label]="(menuOpen() ? 'a11y.closeMenu' : 'a11y.openMenu') | translate"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</header>

<!-- Mobile nav dropdown -->
<nav
  id="mobile-nav"
  class="nav-mobile"
  [class.open]="menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
  [attr.aria-label]="'a11y.mobileNav' | translate"
>
  <a
    routerLink="/progetti"
    routerLinkActive="active"
    #rlaMP="routerLinkActive"
    [attr.aria-current]="rlaMP.isActive ? 'page' : null"
    >{{ 'nav.projects' | translate }}</a
  >
  <a
    routerLink="/chi-sono"
    routerLinkActive="active"
    #rlaMA="routerLinkActive"
    [attr.aria-current]="rlaMA.isActive ? 'page' : null"
    >{{ 'nav.about' | translate }}</a
  >
  <a
    routerLink="/contatti"
    routerLinkActive="active"
    #rlaMMC="routerLinkActive"
    [attr.aria-current]="rlaMMC.isActive ? 'page' : null"
    >{{ 'nav.contact' | translate }}</a
  >
</nav>

<main>
  <router-outlet />
</main>

<app-footer />
