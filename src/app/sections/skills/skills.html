<section id="skills" class="skills">
  <h2>{{ 'skills.title' | translate }}</h2>
  <div class="groups">
    @for (g of groups; track g.key) {
      <div class="group">
        <h3>{{ g.key | translate }}</h3>
        <ul>@for (i of g.items; track i) { <li>{{ i }}</li> }</ul>
      </div>
    }
  </div>
</section>
