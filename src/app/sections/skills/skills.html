<section id="skills" class="skills">
  <div class="sec-head">
    <span>Stack</span>
    <h2>{{ 'skills.title' | translate }}</h2>
  </div>
  <div class="groups">
    @for (g of groups; track g.key) {
      <div class="scard">
        <h4>{{ g.key | translate }}</h4>
        <ul>
          @for (i of g.items; track i) {
            <li>{{ i }}</li>
          }
        </ul>
      </div>
    }
  </div>
</section>
