<section id="about" class="about">
  <img
    class="photo"
    src="/img/marco-sabatini.jpg"
    width="600"
    height="800"
    [alt]="'about.photoAlt' | translate"
  />
  <div class="text">
    <div class="sec-head">
      <span>{{ 'nav.about' | translate }}</span>
      <h2>{{ 'about.title' | translate }}</h2>
    </div>
    <p>{{ 'about.body' | translate }}</p>
    <p>{{ 'about.path' | translate }}</p>
  </div>
</section>
